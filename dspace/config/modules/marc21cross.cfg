# =====================================================================================
# marc21cross.cfg - MARC21 (Koha) -> Dublin Core crosswalk configuration
# Ubicacion: [dspace]/config/modules/marc21cross.cfg
#
# DSpace 9.3: los modulos NO se cargan por comodin. Anadir en local.cfg (recomendado)
# o en dspace.cfg, junto a los demas "include":
#
#     include = ${module_dir}/marc21cross.cfg
#
# Sintaxis general: entradas separadas por la secuencia :-:  y pares  campo_dc = argumento
# La coma literal dentro de un valor debe escaparse como \, porque el parser de
# configuracion de DSpace (commons-configuration2) trata la coma como delimitador de lista.
# =====================================================================================

crosswalk.marc21.custom.metadata = \
									dc.description = 520 - a:-: \
									dc.subject.agrovoc = 650 - a :-: dc.source.art = 773 - g :-: dc.description.pages = 773 - g :-: dc.source.volume = 773 - g :-: \
									dc.source.issue = 773 - g :-: dc.source.elocator = 773 - g	:-: dc.publisher = 260 - b	:-: \
									dc.coverage.place = 260 - a :-: dc.date.issued = 260 - c :-: dc.type = 942 - c :-: dc.language = 041 - a :-: dc.identifier.doi = 024 - a :-: dc.subject.program = 856 - x :-: dc.relation.funderName = 597 - d


# Acciones: metodos de tratamiento de la informacion
# DIVIDE: separa un texto en dos partes a partir de un simbolo dado; se puede conservar
# el texto antes del simbolo, despues del simbolo, o ambas partes.
# Sintaxis: DIVIDE - simbolo_para_separar - Parte_a_conservar (L - Left, R - Right, A - Ambas)
crosswalk.marc21.custom.dc.description.action = DIVIDE - © - L


# MAYUS - MINUS: transforman el texto a mayusculas o minusculas. Sin argumentos.
crosswalk.marc21.custom.dc.subject.agrovoc.action = MAYUS

# SELECT: parte el valor por comas y recorre cada fragmento buscando el patron dado.
# SELECT conserva el resto del fragmento (quita el patron); SELECTNR emite el patron mismo.
# Se pueden encadenar con :-: y gana el primer resultado no vacio.
# Sintaxis: SELECT - patron_para_seleccionar
crosswalk.marc21.custom.dc.description.pages.action = SELECT - p.
crosswalk.marc21.custom.dc.source.volume.action = SELECT - v. :-: SELECTNR - In press
crosswalk.marc21.custom.dc.source.issue.action = SELECT - no.
crosswalk.marc21.custom.dc.source.elocator.action = SELECT - e
crosswalk.marc21.custom.dc.source.art.action = SELECT - art.

# REPLACE: reemplaza una expresion (regex) por otro texto.
# Sintaxis: REPLACE - expresion_a_reemplazar - reemplazo
# Nota: para reemplazar por espacio en blanco use [s]; para eliminar use [d].
# Nota: para usar la coma (,) como expresion a reemplazar use [c].
# Importante: ni la expresion ni el reemplazo pueden contener guiones (-), porque el
# guion es el separador de argumentos de la directiva.
crosswalk.marc21.custom.dc.publisher.action = REPLACE - [c] - [d]
crosswalk.marc21.custom.dc.coverage.place.action = REPLACE - : - [d]
crosswalk.marc21.custom.dc.date.issued.action = REPLACE - [.] - [d]
crosswalk.marc21.custom.dc.identifier.doi.action = REPLACE - http[s]?://doi.org/ - [d]

# CONVERT: cambia el valor obtenido de MARC21 por el que indique un archivo de
# conversiones, o por un valor por defecto si no hay correspondencia.
# Sintaxis: CONVERT - nombre_archivo_conversiones - valor_por_defecto(Opcional)
crosswalk.marc21.custom.dc.type.action = CONVERT - marc21_correspondencias - Other
crosswalk.marc21.custom.dc.language.action = CONVERT - iso_languages
crosswalk.marc21.custom.dc.subject.program.action = CONVERT - oai_sets
crosswalk.marc21.custom.dc.relation.funderName.action = CONVERT - cimmyt_funders


# Los archivos de conversiones se colocan en [dspace-dir]/config/controlled-vocabularies

crosswalk.marc21.default.metadata = \
									dc.rights=CIMMYT manages Intellectual Assets as International Public Goods. The user is free to download\, print\, store and share this work. In case you want to translate or create any other derivative work and share or distribute such translation/derivative work\, please contact CIMMYT-Knowledge-Center@cgiar.org indicating the work you want to use and the kind of use you intend; CIMMYT will contact you with the suitable license for that purpose :-: \
									dc.rights.accesslevel = Open Access:-: dc.type.publicationversion = Published Version :-: dc.audience = Researchers :-: dc.subject.other = AGRICULTURAL SCIENCES AND BIOTECHNOLOGY :-: dspace.entity.type = Publication

crosswalk.marc21.directly.metadata = \
									dc.coverage.countryfocus = 651 - a:-: \
									dc.description.pages = 300 - a:-: \
									dc.creator = 100 - a :-: \
									dc.creator = 700 - a :-: \
                                    dc.creator.corporate = 110 - a :-: \
                                    dc.creator.corporate = 710 - a :-: \
									dc.identifier.isbn = 020 - a :-: \
									dc.title = 245 - a\,b :-: \
									dc.title.alternative = 246 - a\,b :-:\
									dc.relation.impactArea = 597 - a :-: \
									dc.relation.CGIARinitiative = 597 - b :-: \
									dc.relation.actionArea = 597 - c :-: \
									dc.relation.cgspaceuri = 597 - u :-: \
									dc.relation.programAccelerator = 597 - f :-: \
									dc.relation.programAccelerator = 597 - F

crosswalk.marc21.directly.metadata.single =  dcterms.identifier = 001

# Datos que solo se deben cosechar para un tipo de recurso; por defecto es false.
crosswalk.marc21.fields.fortype.enable = true
# Etiqueta MARC21 que contiene el tipo de recurso que se cosecha
crosswalk.marc21.type.label = 942 - c
# Metadatos unicos para el tipo de recurso cosechado.
# Sintaxis: crosswalk.marc21.only.[etiqueta MARC21 del recurso].metadata = campo_dc = etiqueta_MARC21_del_valor
# Se pueden agregar varias etiquetas usando como separador la secuencia :-:
crosswalk.marc21.only.ja.metadata = dc.source.journal = 773 - t :-: dc.source.issn = 773 - x
crosswalk.marc21.only.bk.metadata = dc.source = 773 - t
# CORRECCION DSpace 9.3: la clave "only.bp.metadata" estaba definida DOS veces; el
# parser de configuracion (commons-configuration2 via getString) devuelve solo la
# PRIMERA aparicion, por lo que "dc.source.isbn = 773 - z" se descartaba en silencio.
# Ambos mapeos se fusionan ahora en una sola linea con el separador :-:
crosswalk.marc21.only.bp.metadata = dc.source = 773 - t :-: dc.source.isbn = 773 - z
crosswalk.marc21.only.ma.metadata = dc.description = 500 - a


# Solo para CIMMYT: si el titulo esta en dos subcampos, poner a true para unirlos.
crosswalk.marc21.is.dc.tittle.split = true
# Solo para CIMMYT: si se necesita reemplazar " : " por ": ", poner a true.
crosswalk.marc21.dc.title.clean = true


# Habilitar si la etiqueta MARC 700 esta definida en crosswalk.marc21.directly.metadata
# y asignada a algun metadato Dublin Core.
crosswalk.marc21.dc.optional.700.enabled = true
# Si esta habilitada, definir el metadato alternativo al que enviar la informacion cuando
# la etiqueta MARC tiene el subcampo $e; si no se define, se usa dc.contributor.
#crosswalk.marc21.700.e-enabled.optional.dc = dc.contributor

# Si esta propiedad esta en true, los elementos cosechados se publican directamente en
# "Envios Recientes"; por defecto es false (privados).
#crosswalk.marc21.item.discoverable = true

# Si esta propiedad esta en false, NO se envia correo de confirmacion de cosecha.
# La confirmacion se envia solo si el item se cosecha en privado.
#crosswalk.marc21.item.harvest.notification = false

